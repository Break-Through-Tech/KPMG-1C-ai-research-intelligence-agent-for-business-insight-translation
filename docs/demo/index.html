<!doctype html>
<html lang="en" data-static-demo="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore AI research, inspect source evidence, and prepare business insight briefs. A Break Through Tech × KPMG research prototype."
    />
    <title>Research Intelligence | KPMG</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to workspace</a>
    <aside class="sidebar" aria-label="Workspace navigation">
      <a
        class="brand"
        href="#workspace"
        aria-label="KPMG Research Intelligence home"
        ><img src="kpmg-logo.png" alt="KPMG" /><span
          >Research<br />
          Intelligence</span
        ></a
      >
      <nav id="navigation">
        <a href="#workspace" data-page="workspace"
          ><span data-icon="grid"></span>Workspace</a
        >
        <a href="#library" data-page="library"
          ><span data-icon="book"></span>Example papers<span
            class="nav-count"
            id="paper-count"
            >—</span
          ></a
        >
        <a href="#briefs" data-page="briefs"
          ><span data-icon="bookmark"></span>Saved briefs<span
            class="nav-count"
            id="brief-count"
            >0</span
          ></a
        >
        <a href="#evaluation" data-page="evaluation"
          ><span data-icon="chart"></span>Evaluation</a
        >
      </nav>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          Research Intelligence <span>/</span>
          <strong id="crumb">Workspace</strong>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading-state" role="status">
          Loading the research workspace…
        </div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="source-dialog" aria-labelledby="source-title">
      <div id="source-content"></div>
      <form method="dialog">
        <button class="button secondary">Close source</button>
      </form>
    </dialog>
  </body>
</html>
